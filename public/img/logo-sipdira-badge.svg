<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Base Squircle Badge -->
    <rect x="10" y="10" width="100" height="100" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- 1. Bingkai Geospasial Utama (Royal Blue PU - Spasial) -->
    <rect x="28" y="28" width="46" height="46" rx="10" stroke="#1d4ed8" stroke-width="9" stroke-linejoin="round"/>
    
    <!-- 2. Balok Spasial Aksen (Emerald Green - Daerah Irigasi & Pertanian Kalbar) -->
    <rect x="58" y="58" width="34" height="34" rx="8" fill="#16a34a"/>
  </g>
</svg>
