<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradasi Biru PU Aliran Air Irigasi -->
    <linearGradient id="sipWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gradasi Hijau Subur Lahan Pertanian Kalbar -->
    <linearGradient id="sipField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gradasi Emas PU Koordinat Spasial -->
    <linearGradient id="sipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Bayangan Lembut Modern -->
    <filter id="sipSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2146" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#sipSoftShadow)">
    <!-- 1. Balok Spasial Lahan Irigasi / Petak Sawah (Emerald Green) -->
    <rect x="22" y="24" width="30" height="30" rx="9" fill="url(#sipField)"/>
    
    <!-- Garis Saluran Sekunder Halus Pada Lahan -->
    <path d="M28 39 Q 37 33, 46 39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35" fill="none"/>
    <path d="M37 28 V 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25" fill="none"/>

    <!-- 2. Lengkungan Saluran Utama Air Irigasi 'S' (Royal Blue ke Cyan) -->
    <path d="M12 36 V 19 C12 14.5, 15.5 11, 20 11 H37 C41.5 11, 45 14.5, 45 19 C45 23.5, 41.5 27, 37 27 H23 C18.5 27, 15 30.5, 15 35 V 43" 
          stroke="url(#sipWater)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 3. Titik Simpul Koordinat Spasial Emas PU (GIS Node) -->
    <circle cx="20" cy="11" r="4.5" fill="url(#sipGold)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="45" cy="19" r="3.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
